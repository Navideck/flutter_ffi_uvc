name: linux-arm64-example

# Builds the example app for Linux arm64 and uploads the runnable bundle.
# Doubles as the Linux build check for PRs and main.

on:
  # Manual runs produce an installable bundle for on-device testing without
  # needing a code change.
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "linux/**"
      - "lib/**"
      - "example/**"
      - ".github/workflows/linux-arm64-example.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "linux/**"
      - "lib/**"
      - "example/**"
      - ".github/workflows/linux-arm64-example.yml"

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      # Official Flutter tarballs are x64-only; on arm64 hosts the SDK
      # bootstraps itself from a git checkout.
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.44.8 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Build example (release)
        working-directory: example
        run: |
          flutter --version
          flutter build linux --release

      # Tar before uploading: artifact zips drop the execute bits.
      - name: Pack bundle
        run: tar -C example/build/linux/arm64/release -czf linux-arm64-bundle.tar.gz bundle

      - uses: actions/upload-artifact@v4
        with:
          name: example-linux-arm64
          path: linux-arm64-bundle.tar.gz
